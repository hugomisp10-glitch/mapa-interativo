button{font:inherit;color:inherit;cursor:pointer}
.ch{white-space:nowrap;border:1px solid #ffffff55;background:transparent;color:#fff;border-radius:16px;padding:4px 11px}

.sheet.open{display:flex}
.sb{overflow:auto;padding:10px 14px 12px}

.tag{display:inline-block;font-size:11px;border-radius:9px;padding:1px 8px;background:var(--pine);color:#fff;margin:0 4px 4px 0}
.tag.g{background:var(--gold);color:#2b2000}

.x{position:absolute;right:8px;top:8px;width:30px;height:30px;border-radius:15px;border:0;background:#0007;color:#fff;font-size:18px;line-height:1}
.btn{border:1px solid var(--pine);background:var(--pine);color:#fff;border-radius:10px;padding:6px 12px;margin:2px 6px 2px 0}
.btn.o{background:none;color:var(--ink);border-color:var(--line)}
nav{display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0)}
nav button{flex:1;border:0;background:none;padding:9px 0;font-weight:600;color:var(--mut)}
nav button.on{color:var(--red);box-shadow:inset 0 3px 0 var(--red)}
#dr{max-height:78%}
#dr input{width:100%;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--land);color:var(--ink);font:inherit;margin-bottom:6px}
.it{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:8px 2px}
.it svg{flex:none}.it small{display:block;color:var(--mut)}
.gh{font:700 12px system-ui;color:var(--mut);margin:10px 0 2px}
.tj{border:1px solid var(--line);border-radius:12px;padding:9px 11px;margin:0 0 8px;background:var(--land)}
.tj b{font:700 15px Georgia,serif}.tj small{color:var(--mut)}

@media(prefers-reduced-motion:reduce){.dt{transition:none}}
